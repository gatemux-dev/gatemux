# Local-only dex IdP for smoke testing the OIDC flow.
#
# Issuer is http://dex:5556/dex when reached from the gatemux container,
# http://localhost:5556/dex when reached from the host. We pick the
# container-side URL because the OIDC discovery + JWKS lookups happen
# in the gatemux process; the browser only needs the authorize endpoint
# during the redirect, which we publish via expose.
# Issuer must be reachable by both the gateway (for discovery + JWKS)
# and the user's browser (for the authorize redirect). Inside the docker
# network 'dex' resolves to this container; the host port mapping below
# is what makes it reachable from the browser. Operators running this
# locally typically add `127.0.0.1 dex` to /etc/hosts so both sides agree
# on the issuer string.
issuer: http://dex:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

# A single static client matching what gatemux's config.yaml expects.
staticClients:
  - id: gatemux-web
    name: GateMux (dev)
    secret: gatemux-dex-secret
    redirectURIs:
      - http://localhost:4000/auth/oidc/callback

# Static users so we don't need to bring up a connector. Two users so we
# can demonstrate role mapping (alice in gatemux-admin, bob just a member).
# Hashes are bcrypt; the password is "password" for both — it's a smoke
# test box, not production.
enablePasswordDB: true
staticPasswords:
  - email: alice@example.com
    # bcrypt of "password"
    hash: "$2b$10$xPuKZT.WbiDxr6oMqwIPeOZ6wINHjuRUXQDMfL4QutH.YTNwm0gGq"
    username: alice
    userID: "static-alice-id"
  - email: bob@example.com
    hash: "$2b$10$xPuKZT.WbiDxr6oMqwIPeOZ6wINHjuRUXQDMfL4QutH.YTNwm0gGq"
    username: bob
    userID: "static-bob-id"
