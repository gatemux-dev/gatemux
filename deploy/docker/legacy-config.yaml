# Development-stack upgrade sample only. Preserve your actual old settings,
# credentials, providers and policy; do not overwrite a private configuration.
server:
  addr: ":4000"
  shutdown:
    grace_period: 30s
    cleanup_timeout: 10s
database:
  driver: postgres
  dsn: "postgres://aiport:aiport@postgres:5432/aiport?sslmode=disable"
redis:
  addr: "redis:6379"
  db: 0
  key_prefix: "aiport"
admin:
  master_key_env: GATEMUX_ADMIN_KEY
deployments:
  - name: openai-main
    type: openai
    upstream_model: gpt-4-turbo
    api_key_env: OPENAI_API_KEY
    max_parallel_requests: 128
aliases:
  - alias: gpt-4
    deployments: [openai-main]
