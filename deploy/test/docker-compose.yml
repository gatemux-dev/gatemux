# Disposable integration dependencies only. Never attach preview volumes.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gatemux
      POSTGRES_PASSWORD: gatemux
      POSTGRES_DB: gatemux
    ports: ["127.0.0.1:55434:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatemux"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56380:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
